# Platinum: sirve el build de la web y reenvía /api a la API (contenedor `api`).
# Llega por el túnel de Cloudflare: la IP real del visitante viene en CF-Connecting-IP. Se pasa a la API
# como X-Forwarded-For (la API tiene `trust proxy` = 1); sin esto el límite de intentos de login contaría
# a todos los usuarios como una sola IP y los bloquearía juntos.
map $http_cf_connecting_ip $ip_real {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Varias fotos por reporte (la API limita cada una a MAX_UPLOAD_MB).
    client_max_body_size 40M;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $ip_real;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # Service worker, manifiesto y página principal: siempre se revisan, para que las versiones nuevas lleguen.
    location ~ ^/(index\.html|sw\.js|push-sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Archivos con hash en el nombre: nunca cambian.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Modelos del reconocimiento facial (pesados y fijos).
    location /modelos/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # SPA: cualquier ruta que no sea archivo cae a index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
